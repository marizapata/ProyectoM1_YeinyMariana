<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Generador de Paletas</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>Generador de Paletas 🎨</h1>
    <p>Crea combinaciones de colores aleatorias</p>
  </header>

  <main>

    <section class="controls">

  <div class="top-controls">

    <label for="paletteSize">
      Cantidad de colores:
    </label>

    <select id="paletteSize">

      <option value="6">6 colores</option>
      <option value="8">8 colores</option>
      <option value="9">9 colores</option>

    </select>

    <label for="colorFormat">
      Formato:
    </label>

    <select id="colorFormat">

      <option value="HEX">HEX</option>
      <option value="HSL">HSL</option>

    </select>

    <button id="generateBtn">
      Generar paleta
    </button>

  </div>

</section>


<section id="paletteContainer">

  <!-- Aquí aparecerán los colores -->

</section>

 <div id="message"></div>

  </main>

  <script src="script.js"></script>

</body>

</html>
